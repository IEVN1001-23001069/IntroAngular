<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <h2>Formulario</h2>
                <form> 
                <div class="form-group pt-4">
                    <label for="num1">Número 1</label>
                    <input [(ngModel)]='num1' name="num1" type="text" class="form-control" id="num1"
                    placeholder="Ingrese el valor de x1: ">
                </div>
                <div class="form-group pt-4">
                    <label for="num2">Número 2</label>
                    <input [(ngModel)]='num2' name="num2" type="text" class="form-control" id="num2"
                    placeholder="Ingrese el valor de y1: ">
                </div>
                <div class="form-group pt-4">
                    <label for="num1">Número 3</label>
                    <input [(ngModel)]='num3' name="num3" type="text" class="form-control" id="num3"
                    placeholder="Ingrese el valor de x2: ">
                </div>
                <div class="form-group pt-4">
                    <label for="num2">Número 4</label>
                    <input [(ngModel)]='num4' name="num4" type="text" class="form-control" id="num4"
                    placeholder="Ingrese el valor de y2: ">
                </div>

                <button (click)="calcular()" type="button" class="btn btn-primary">
                    Calcular 
                </button>
            </form>
            </div>
            <div class="col-6">
                <h2>Distancia: {{resultado}}</h2>
            </div>
        </div>
    </div> 
</body>
</html>
