<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <h2>Formulario</h2>
                <form>

                <div class="form-group pt-4">
                    <label for="num1">Número 1</label>
                    <input [(ngModel)]='num1' name="num1" type="text" class="form-control" id="num1"
                    placeholder="Ingrese número 1: ">
                </div>
                <div class="form-group pt-4">
                    <label for="num2">Número 2</label>
                    <input [(ngModel)]='num2' name="num2" type="text" class="form-control" id="num2"
                    placeholder="Ingrese número 2: ">
                </div>

                <br>
                <div class="form-check">
                <input [(ngModel)]='operacionSeleccionada' class="form-check-input" type="radio" name="grupoOperaciones" id="opcionsum" value="sumar" checked>
                <label class="form-check-label" for="exampleRadios1">
                 Sumar
                </label>
                </div>
                <div class="form-check">
                <input [(ngModel)]='operacionSeleccionada' class="form-check-input" type="radio" name="grupoOperaciones" id="opcionrestar" value="restar" checked>
                <label class="form-check-label" for="exampleRadios1">
                 Restar
                </label>
                </div>
                <div class="form-check">
                <input [(ngModel)]='operacionSeleccionada' class="form-check-input" type="radio" name="grupoOperaciones" id="opciondividir" value="dividir" checked>
                <label class="form-check-label" for="exampleRadios1">
                 Dividir
                </label>
                </div>
                <div class="form-check">
                <input [(ngModel)]='operacionSeleccionada' class="form-check-input" type="radio" name="grupoOperaciones" id="opcionmultiplicar" value="multiplicar" checked>
                <label class="form-check-label" for="exampleRadios1">
                 Multiplicar
                </label>
                </div>

                <button (click)="calcular()" type="button" class="btn btn-primary">
                    Calcular
                </button>

                <!-- <button (click)="sumar()" type="button" class="btn btn-primary">
                    Sumar
                </button>

                <button (click)="restar()" type="button" class="btn btn-primary">
                   Restar 
                </button>

                <button (click)="mult()" type="button" class="btn btn-primary">
                   Multiplicar
                </button>

                <button (click)="div()" type="button" class="btn btn-primary">
                   Dividir
                </button> -->
                
            </form>
            </div>
            <div class="col-6">
                <h2>Resultado: {{resultado}}</h2>
            </div>
        </div>
    </div> 
</body>
</html>
